name: explorer-ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  focused-behavior:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install focused-test build dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libboost-dev
      - name: Compile focused behavior tests with warnings as errors
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -I.
          tests/regression_tests.cpp -o /tmp/qwc-explorer-regression
      - name: Run focused behavior tests
        run: /tmp/qwc-explorer-regression
      - name: Run EPoSe presentation-state tests
        run: node tests/epose_status.test.js
      - name: Run supplemental static route contracts
        run: cmake -DSOURCE_DIR=. -P tests/privacy_routes.cmake
      - name: Check patch whitespace
        run: git show --check --oneline --no-renames HEAD

  supported-container-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.node01
          push: false
          tags: qwertycoin-explorer:ci
          build-args: |
            UBUNTU_IMAGE=ubuntu:22.04@sha256:79676deb51ebb02885b0b9d33788e78a37cf1045ad79d1bb04c6a222c3556b3d
            QWC_COMMIT=af759410f63fd9ba7dd7ac890365f3f9962841e8
            EXPLORER_SOURCE_SHA=${{ github.sha }}
            EXPLORER_SOURCE_DATE=ci
            EXPLORER_SOURCE_BRANCH=ci
            NPROC=2
          cache-from: type=gha,scope=qwc-core-af759410f
          cache-to: type=gha,mode=max,scope=qwc-core-af759410f
