include /etc/nginx/snippets/qwertycoin-explorer-upstream.conf;
include /etc/nginx/snippets/qwertycoin-wallet-rpc-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name explorer.qwertycoin.org;

    client_max_body_size 64k;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/(myoutputs|prove(?:/|$)|api/outputs(?:blocks)?$|rawkeyimgs$|checkrawkeyimgs$|rawoutputkeys$|checkrawoutputkeys$) {
        access_log off;
        return 410;
    }

    location = /qwc-rpc {
        access_log off;
        return 404;
    }

    # Wallet compatibility endpoint. The explorer application parses JSON-RPC
    # envelopes, enforces the wallet method/path allowlist and then talks only
    # to the configured restricted daemon listener. Request bodies stay out of
    # logs; unknown methods are rejected before they reach the daemon.
    location /qwc-rpc/ {
        access_log off;
        client_max_body_size 2m;
        proxy_pass http://qwertycoin_wallet_rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }

    location ~ ^/(healthz|readyz)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://qwertycoin_explorer_backend;
        access_log off;
    }

    location / {
        proxy_pass http://qwertycoin_explorer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
