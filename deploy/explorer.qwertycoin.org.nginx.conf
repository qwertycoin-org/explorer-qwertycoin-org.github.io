include /etc/nginx/snippets/qwertycoin-explorer-upstream.conf;
include /etc/nginx/snippets/qwertycoin-wallet-rpc-upstream.conf;

# The browser-facing wallet adapter is intentionally available only to the
# production wallet and its immutable Cloudflare Pages previews. Keep this
# decision at the public edge: Crow answers OPTIONS before route handlers, so
# proxying a preflight would omit the route-level allowlist headers.
map $http_origin $qwc_wallet_cors_origin {
    default "";
    "https://wallet.qwertycoin.org" $http_origin;
    ~^https://[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.pages\.dev$ $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name explorer.qwertycoin.org;

    client_max_body_size 64k;
    # The application emits the same policy headers when reached directly.
    # Hide them at the public edge so each response carries one authoritative
    # value, including Nginx-generated error responses.
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/(myoutputs|prove(?:/|$)|api/outputs(?:blocks)?$|rawkeyimgs$|checkrawkeyimgs$|rawoutputkeys$|checkrawoutputkeys$) {
        access_log off;
        return 410;
    }

    location = /qwc-rpc {
        access_log off;
        return 404;
    }

    # Wallet compatibility endpoint. The explorer application parses JSON-RPC
    # envelopes, enforces the wallet method/path allowlist and then talks only
    # to the configured restricted daemon listener. Request bodies stay out of
    # logs; unknown methods are rejected before they reach the daemon.
    location /qwc-rpc/ {
        access_log off;
        client_max_body_size 2m;

        # Returning from this method-only condition is safe and prevents
        # automatic upstream OPTIONS handling from bypassing the allowlist.
        # An empty map value suppresses Access-Control-Allow-Origin, so unknown
        # origins remain fail-closed while still receiving a normal 204.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $qwc_wallet_cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Vary "Origin" always;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 204;
        }

        proxy_pass http://qwertycoin_wallet_rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }

    location ~ ^/(healthz|readyz)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://qwertycoin_explorer_backend;
        access_log off;
    }

    location / {
        proxy_pass http://qwertycoin_explorer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
