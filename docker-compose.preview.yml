services:
  qwertycoin-explorer:
    image: "${QWC_EXPLORER_IMAGE:?immutable explorer image digest required}"
    container_name: "${QWC_EXPLORER_CONTAINER_NAME:?distinct preview container name required}"
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${QWC_EXPLORER_UID:?uid required}:${QWC_EXPLORER_GID:?gid required}"
    command:
      - --port
      - "8081"
      - --bindaddr
      - 0.0.0.0
      - --bc-path
      - /home/qwertycoin/.qwertycoin/lmdb
      - --daemon-url
      - "${QWC_DAEMON_URL:?restricted observer RPC URL required}"
      - --derived-data-path
      - /var/lib/qwertycoin-explorer
      - --chain-reset-id
      - "${QWC_CHAIN_RESET_ID:?chain reset context required}"
      - --enable-json-api
    ports:
      - "127.0.0.1:${QWC_EXPLORER_HOST_PORT:?distinct loopback host port required}:8081"
    volumes:
      - chain:/home/qwertycoin/.qwertycoin:ro
      - explorer-derived:/var/lib/qwertycoin-explorer
    networks:
      - qwertycoin-mainnet
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  chain:
    external: true
    name: "${QWC_CHAIN_VOLUME:?verified existing chain volume required}"
  explorer-derived:
    external: true
    name: "${QWC_EXPLORER_DERIVED_VOLUME:?distinct explorer-derived volume required}"

networks:
  qwertycoin-mainnet:
    external: true
    name: "${QWC_DOCKER_NETWORK:?verified existing daemon network required}"
