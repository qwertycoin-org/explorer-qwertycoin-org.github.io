<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F5F1E7">
    <meta name="description" content="Inspect Qwertycoin blocks, transactions, service nodes, epochs, mempool and network observations.">
    <meta name="robots" id="robots-policy" content="index,follow">
    <link rel="canonical" id="canonical-url" href="https://explorer.qwertycoin.org/">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preload" href="/assets/fonts/archivo-latin-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600.woff2" as="font" type="font/woff2" crossorigin>
    <meta http-equiv="cache-control" content="no-cache">
    <script>(function(){var t="";try{t=localStorage.getItem("qwc-theme")||"";}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}());</script>
    <title>Qwertycoin Explorer</title>
    <style type="text/css">{{#css_styles}}{{/css_styles}}</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to explorer content</a>
<header class="site-header">
    <nav class="nav" aria-label="Explorer navigation">
        <a class="brand" href="/" aria-label="Qwertycoin Explorer">
            <img src="/assets/qwertycoin-mark.svg" width="44" height="44" alt="">
            <span class="brand-name">QWERTYCOIN</span>
            <span class="brand-product">EXPLORER</span>
        </a>
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
            <span class="sr-only">Open explorer navigation</span>
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <div class="nav-links" id="primary-navigation">
            <a href="/" data-section="overview">Overview</a>
            <a href="/blocks" data-section="blocks">Blocks</a>
            <a href="/txpool" data-section="mempool">Mempool</a>
            <a href="/service-nodes" data-section="service-nodes">Service Nodes</a>
            <a href="/epochs" data-section="epochs">Epochs</a>
            <a href="/network" data-section="network">Network</a>
            <a class="website-link" href="https://qwertycoin.org/">Website</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-label">Dark theme</span></button>
        </div>
    </nav>
</header>

<section class="explorer-search-hero">
    <form action="/search" method="post" class="search-panel style-1" autocomplete="off" role="search">
        <label for="explorer-search">Search the blockchain</label>
        <div class="search-controls">
            <input id="explorer-search" type="text" name="value" maxlength="128" required
                   placeholder="Block height, block hash or transaction hash">
            <input type="submit" value="Search">
        </div>
    </form>
</section>

<main class="explorer-main" id="main-content" tabindex="-1">
<script>
(function(){
    "use strict";
    var themeButton=document.getElementById("theme-toggle");
    var navButton=document.getElementById("nav-toggle");
    var navigation=document.getElementById("primary-navigation");
    var themeMeta=document.querySelector('meta[name="theme-color"]');
    var media=window.matchMedia("(prefers-color-scheme: dark)");
    function storedTheme(){try{return localStorage.getItem("qwc-theme")||"";}catch(e){return "";}}
    function currentTheme(){return document.documentElement.dataset.theme||(media.matches?"dark":"light");}
    function updateTheme(){var dark=currentTheme()==="dark";themeButton.setAttribute("aria-pressed",dark?"true":"false");themeButton.querySelector(".theme-label").textContent=dark?"Light theme":"Dark theme";if(themeMeta)themeMeta.content=dark?"#141414":"#F5F1E7";}
    themeButton.addEventListener("click",function(){var next=currentTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("qwc-theme",next);}catch(e){}updateTheme();});
    media.addEventListener("change",function(event){if(!storedTheme()){document.documentElement.dataset.theme=event.matches?"dark":"light";updateTheme();}});

    function closeNavigation(returnFocus){navButton.setAttribute("aria-expanded","false");navigation.removeAttribute("data-open");navButton.querySelector(".sr-only").textContent="Open explorer navigation";if(returnFocus)navButton.focus();}
    navButton.addEventListener("click",function(){var open=navButton.getAttribute("aria-expanded")!=="true";navButton.setAttribute("aria-expanded",open?"true":"false");navigation.toggleAttribute("data-open",open);navButton.querySelector(".sr-only").textContent=open?"Close explorer navigation":"Open explorer navigation";});
    navigation.addEventListener("click",function(event){if(event.target.closest("a")&&window.matchMedia("(max-width: 1120px)").matches)closeNavigation(false);});
    document.addEventListener("keydown",function(event){if(event.key==="Escape"&&navButton.getAttribute("aria-expanded")==="true")closeNavigation(true);});

    var path=window.location.pathname;
    var section=path==="/"||path.indexOf("/page/")===0?"overview":path.indexOf("/blocks")===0?"blocks":path==="/mempool"||path==="/txpool"?"mempool":path.indexOf("/service-nodes")===0?"service-nodes":path.indexOf("/epochs")===0?"epochs":path.indexOf("/network")===0?"network":"";
    var active=navigation.querySelector('[data-section="'+section+'"]');if(active)active.setAttribute("aria-current","page");
    var title="Qwertycoin Explorer";
    if(path.indexOf("/block/")===0)title="Block "+decodeURIComponent(path.slice(7))+" · Qwertycoin Explorer";
    else if(path.indexOf("/tx/")===0)title="Transaction "+decodeURIComponent(path.split("/")[2]||"")+" · Qwertycoin Explorer";
    else if(section&&section!=="overview")title=(active?active.textContent:"Explorer")+" · Qwertycoin Explorer";
    document.title=title;
    var canonical=document.getElementById("canonical-url");if(canonical)canonical.href="https://explorer.qwertycoin.org"+path;
    if(path==="/search"){var robots=document.getElementById("robots-policy");if(robots)robots.content="noindex,nofollow";}

    function fallbackCopy(value){var area=document.createElement("textarea");area.value=value;area.setAttribute("readonly","");area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(area);return ok?Promise.resolve():Promise.reject();}
    document.addEventListener("click",function(event){var copy=event.target.closest("[data-copy]");if(!copy)return;var label=copy.dataset.copyLabel||copy.textContent;copy.dataset.copyLabel=label;var operation=navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(copy.dataset.copy):fallbackCopy(copy.dataset.copy);operation.then(function(){copy.textContent="Copied";copy.dataset.copyState="success";}).catch(function(){copy.textContent="Copy failed";copy.dataset.copyState="error";}).finally(function(){setTimeout(function(){copy.textContent=label;delete copy.dataset.copyState;},1800);});});
    updateTheme();
}());
</script>
