<main class="explorer-main" id="main-content" tabindex="-1">
<script>
(function(){
    var button=document.getElementById("theme-toggle"); if(!button)return;
    function current(){return document.documentElement.dataset.theme || (window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
    function update(){var dark=current()==="dark";button.setAttribute("aria-pressed",dark?"true":"false");button.textContent=dark?"Light theme":"Dark theme";}
    button.addEventListener("click",function(){var next=current()==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("qwc-theme",next);}catch(e){}update();}); update();
}());
</script>
